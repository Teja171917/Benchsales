<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BenchPilot — Create account</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #0b1220; color: #e6edf7; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; }
  .card { width: min(92vw, 360px); background: #111a2e; border: 1px solid #22304d;
          border-radius: 14px; padding: 28px 26px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #93a4bd; font-size: 14px; }
  label { display: block; font-size: 13px; color: #b8c6da; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px;
          border: 1px solid #2b3c5c; background: #0b1220; color: #e6edf7; font-size: 15px; }
  button.main { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 9px;
          background: #2f7cf6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .err { background: #3a1620; border: 1px solid #7a2438; color: #ffb4c0;
         border-radius: 9px; padding: 10px 12px; font-size: 14px; margin-bottom: 6px; display: none; }
  .ok { background: #123324; border: 1px solid #1f6b45; color: #a7e8c5;
        border-radius: 9px; padding: 12px; font-size: 14px; display: none; }
  a { color: #7db4ff; }
  .hint { font-size: 12px; color: #64748b; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="card">
  <h1>BenchPilot</h1>
  <p class="sub">Create your account. An admin approves new signups before you can sign in.</p>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <form id="f">
    <label for="name">Full name</label>
    <input id="name" type="text" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password (8+ characters)</label>
    <input id="password" type="password" autocomplete="new-password" required>
    <label for="company">Company ID (optional)</label>
    <input id="company" type="text" list="companies" autocomplete="off">
    <datalist id="companies"></datalist>
    <p class="hint">Joining a company? Enter its ID — for example <b>rsatech</b> — and that company's admin approves you. Leave it blank for a personal account: the main admin approves those.</p>
    <button class="main" type="submit">Request account</button>
  </form>
  <p style="margin:18px 0 0; font-size:13px; color:#93a4bd; text-align:center">
    Already have an account? <a href="/login">Sign in</a>
  </p>
</div>
<script>
  var errBox = document.getElementById('err');
  function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  fetch('/api/auth/companies').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('companies').innerHTML = (d.companies || []).map(function (c) {
      return '<option value="' + c.id + '">' + c.name + '</option>';
    }).join('');
  }).catch(function () {});
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    fetch('/api/auth/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: document.getElementById('name').value,
                             email: document.getElementById('email').value,
                             password: document.getElementById('password').value,
                             company_id: document.getElementById('company').value })
    }).then(function (r) {
      return r.json().then(function (d) {
        if (r.ok) {
          document.getElementById('f').style.display = 'none';
          var ok = document.getElementById('ok');
          ok.style.display = 'block';
          ok.textContent = 'Account requested. An admin will approve it — once they do, sign in with this email and password.';
        } else { showErr(d.detail || 'Signup failed.'); }
      });
    }).catch(function () { showErr('Could not reach the server.'); });
  });
</script>
</body>
</html>
